<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Waffen Card Test</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; color: #fff; font-family: -apple-system, sans-serif; padding: 40px; }
:root {
    --bg-secondary: #0a0a0a; --bg-tertiary: #1a1a1a; --bg-hover: #252525;
    --accent-primary: #00ff88; --accent-secondary: #00ccff;
    --text-primary: #fff; --text-secondary: #a1a1aa; --text-muted: #71717a;
    --border-color: #27272a; --radius-sm: 4px; --radius-md: 8px;
    --spacing-xs: 4px; --spacing-sm: 8px; --spacing-md: 16px;
    --font-size-xs: 11px; --font-size-sm: 13px; --font-size-md: 14px;
    --transition-fast: 150ms ease;
}
.items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 900px; }
.item-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: var(--spacing-md); }
.item-card:hover { border-color: var(--accent-primary); }
.item-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: var(--spacing-sm); }
.item-name { font-weight: 600; font-size: var(--font-size-md); }
.item-id { font-size: var(--font-size-xs); color: var(--text-muted); font-family: monospace; margin-top: 2px; }
.item-category-badge { background: var(--bg-tertiary); padding: 4px 8px; border-radius: var(--radius-sm); font-size: var(--font-size-xs); color: var(--text-secondary); }
.item-controls { display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-md); }
.item-controls input { flex: 1; padding: var(--spacing-sm); background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: var(--font-size-sm); text-align: center; }
.btn-spawn-card { flex: 2; padding: var(--spacing-sm); background: var(--accent-primary); border: none; border-radius: var(--radius-sm); color: #000; font-weight: 600; font-size: var(--font-size-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
.item-give-row { display: flex; gap: var(--spacing-sm); margin-top: var(--spacing-sm); padding-top: var(--spacing-sm); border-top: 1px solid var(--border-color); }
.give-player-id { flex: 1; padding: var(--spacing-sm); background: var(--bg-tertiary); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: #fff; font-size: var(--font-size-sm); text-align: center; }
.give-player-id::placeholder { color: var(--text-muted); font-size: var(--font-size-xs); }
.btn-give-card { flex: 2; padding: var(--spacing-sm); background: var(--accent-secondary); border: none; border-radius: var(--radius-sm); color: #000; font-weight: 600; font-size: var(--font-size-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
h2 { color: var(--accent-primary); margin-bottom: 20px; }
</style>
</head>
<body>
<h2>Waffen v3.0 — Karten mit "Geben" Button</h2>
<div class="items-grid">
  <div class="item-card">
    <div class="item-header">
      <div><div class="item-name">Pistole</div><div class="item-id">WEAPON_PISTOL</div></div>
      <div class="item-category-badge">Pistolen</div>
    </div>
    <div class="item-controls">
      <input type="number" value="250" placeholder="Munition">
      <button class="btn-spawn-card">➕ Spawnen</button>
    </div>
    <div class="item-give-row">
      <input type="number" class="give-player-id" placeholder="Spieler-ID">
      <button class="btn-give-card">➡️ Geben</button>
    </div>
  </div>
  <div class="item-card">
    <div class="item-header">
      <div><div class="item-name">Combat Pistole</div><div class="item-id">WEAPON_COMBATPISTOL</div></div>
      <div class="item-category-badge">Pistolen</div>
    </div>
    <div class="item-controls">
      <input type="number" value="250" placeholder="Munition">
      <button class="btn-spawn-card">➕ Spawnen</button>
    </div>
    <div class="item-give-row">
      <input type="number" class="give-player-id" placeholder="Spieler-ID">
      <button class="btn-give-card">➡️ Geben</button>
    </div>
  </div>
  <div class="item-card">
    <div class="item-header">
      <div><div class="item-name">Verbandskasten</div><div class="item-id">bandage</div></div>
      <div class="item-category-badge">Medizin</div>
    </div>
    <div class="item-controls">
      <input type="number" value="1" placeholder="Anzahl">
      <button class="btn-spawn-card">➕ Spawnen</button>
    </div>
    <div class="item-give-row">
      <input type="number" class="give-player-id" placeholder="Spieler-ID">
      <button class="btn-give-card">➡️ Geben</button>
    </div>
  </div>
</div>
</body>
</html>
