<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waffen Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Container starts hidden - NO DEBUG ELEMENTS -->
    <div id="container" class="hidden">
        <div class="main-panel">
            <!-- Header -->
            <div class="header">
                <div class="header-title">
                    <h1>WAFFEN MANAGEMENT</h1>
                    <p class="subtitle">Professional Admin Control</p>
                </div>
                <button class="close-btn" onclick="closeUI()">×</button>
            </div>

            <!-- Navigation Tabs -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('weapons', this)">
                    <span class="tab-icon">▸</span>
                    WAFFEN
                </button>
                <button class="tab-btn" onclick="switchTab('items', this)">
                    <span class="tab-icon">▸</span>
                    ITEMS
                </button>
                <button class="tab-btn" onclick="switchTab('players', this)">
                    <span class="tab-icon">▸</span>
                    SPIELER
                </button>
            </div>

            <!-- Content Area -->
            <div class="content">
                <!-- Weapons Tab -->
                <div id="weapons-tab" class="tab-content active">
                    <div class="controls-row">
                        <div class="search-box">
                            <input type="text" id="weapon-search" placeholder="Waffe suchen..." oninput="filterWeapons()">
                        </div>
                        <div class="category-filter">
                            <select id="weapon-category" onchange="filterWeapons()">
                                <option value="all">Alle Kategorien</option>
                            </select>
                        </div>
                        <div class="ammo-input">
                            <label>Munition:</label>
                            <input type="number" id="weapon-ammo" value="250" min="0" max="9999">
                        </div>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-danger" onclick="removeAllWeapons()">
                            <span class="btn-icon">×</span>
                            Alle Waffen entfernen
                        </button>
                    </div>

                    <div id="weapons-list" class="items-grid"></div>
                </div>

                <!-- Items Tab -->
                <div id="items-tab" class="tab-content">
                    <div class="controls-row">
                        <div class="search-box">
                            <input type="text" id="item-search" placeholder="Item suchen..." oninput="filterItems()">
                        </div>
                        <div class="amount-input">
                            <label>Anzahl:</label>
                            <input type="number" id="item-amount" value="1" min="1" max="999">
                        </div>
                    </div>

                    <div id="items-list" class="items-grid"></div>
                </div>

                <!-- Players Tab -->
                <div id="players-tab" class="tab-content">
                    <div class="controls-row">
                        <button class="btn btn-primary" onclick="refreshPlayers()">
                            <span class="btn-icon">↻</span>
                            Spielerliste aktualisieren
                        </button>
                    </div>

                    <div class="info-box">
                        <p>Zeigt Spieler in einem Umkreis von 50m</p>
                    </div>

                    <div id="players-list" class="players-list"></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <p>Drücke <kbd>ESC</kbd> zum Schließen | Version 1.0.6</p>
            </div>
        </div>
    </div>

    <!-- Munitions-Dialog -->
    <div id="ammo-dialog" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎯 Munition hinzufügen?</h2>
            </div>
            <div class="modal-body">
                <p id="ammo-dialog-text">Möchtest du Munition für diese Waffe spawnen?</p>
                <div class="ammo-amount-selector">
                    <label for="ammo-amount">Munitionsmenge:</label>
                    <input type="number" id="ammo-amount" value="250" min="1" max="9999" />
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="confirmAmmo(true)">
                    <span class="btn-icon">✓</span>
                    Ja, Munition spawnen
                </button>
                <button class="btn btn-danger" onclick="confirmAmmo(false)">
                    <span class="btn-icon">✗</span>
                    Nein, danke
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
